<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Trắc Nghiệm Phản Xạ - Lịch Sử 10</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --green: #10b981;
            --green-bg: #d1fae5;
            --red: #ef4444;
            --red-bg: #fee2e2;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* --- Header & Stats --- */
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background-color: #f8fafc;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            margin-top: 4px;
        }
        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }
        .stat-value.blue { color: var(--primary); }

        .progress-container {
            width: 100%;
            height: 10px;
            background-color: var(--border);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        /* --- Question Area --- */
        .content {
            padding: 24px;
        }

        .question-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            display: flex;
            align-items: flex-start;
            width: 100%;
            padding: 16px;
            background-color: #fff;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-main);
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover:not(.disabled) {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        .option-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background-color: var(--bg-color);
            border-radius: 50%;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        /* --- Feedback States --- */
        .option-btn.disabled {
            cursor: not-allowed;
            pointer-events: none;
        }

        .option-btn.correct {
            background-color: var(--green-bg);
            border-color: var(--green);
            color: #065f46;
            animation: shake 0.4s ease-in-out;
        }

        .option-btn.correct .option-letter {
            background-color: var(--green);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--red-bg);
            border-color: var(--red);
            color: #991b1b;
        }

        .option-btn.wrong .option-letter {
            background-color: var(--red);
            color: white;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* --- Action Area --- */
        .actions {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer-controls {
            padding: 16px 24px;
            background-color: #f8fafc;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .header { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .content { padding: 16px; }
            .question-text { font-size: 16px; }
            .option-btn { padding: 12px; font-size: 15px; }
            .footer-controls { flex-direction: column; gap: 12px; }
            .footer-controls .btn { width: 100%; }
            .actions { flex-direction: column; }
            .actions .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header & Stats -->
        <div class="header">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Câu hỏi</div>
                    <div class="stat-value" id="stat-progress">0/60</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Đúng</div>
                    <div class="stat-value green" id="stat-correct">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Sai</div>
                    <div class="stat-value red" id="stat-wrong">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Tỷ lệ đúng</div>
                    <div class="stat-value blue" id="stat-score">0%</div>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <!-- Question Area -->
        <div class="content">
            <div class="question-number" id="question-number">Câu 1 / 60</div>
            <div class="question-text" id="question-text">Đang tải câu hỏi...</div>
            
            <div class="options-list" id="options-container">
                <!-- Options will be rendered here by JS -->
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="btn-next" style="display: none;" onclick="nextQuestion()">Câu tiếp theo &rarr;</button>
            </div>
        </div>

        <!-- Footer Controls -->
        <div class="footer-controls">
            <button class="btn btn-secondary" onclick="resetQuiz()">↺ Làm lại từ đầu</button>
            <button class="btn btn-secondary" onclick="shuffleQuiz()">🔀 Xáo trộn câu hỏi</button>
        </div>
    </div>

                options: [
                    "A. Kĩ năng, kinh nghiệm, niềm tin, bí quyết.",
                    "B. Tác phẩm sử học, bí quyết, kĩ năng thực hành.",
                    "C. Sách, báo, băng ghi âm, bí quyết.",
                    "D. Văn bản, tác phẩm sử học, kết quả nghiên cứu."
                ],
                correct: 3
            },
            {
                question: "Quá trình xử lý thông tin sử liệu được tiến hành nhằm mục đích nào sau đây?",
                options: [
                    "A. Tìm kiếm, tập hợp những thông tin liên quan đến các sự kiện, hiện tượng lịch sử.",
                    "B. Xác định tính xác thực, giá trị của sử liệu và thông tin mà sử liệu đó phản ánh.",
                    "C. Xác thực mối quan hệ giữa hiện thực lịch sử và lịch sử được con người nhận thức.",
                    "D. Khảo sát và sưu tầm những nguồn sử liệu liên quan đến đối tượng nghiên cứu."
                ],
                correct: 1
            },
            {
                question: "Tác phẩm điêu khắc tiêu biểu nào dưới đây không phải là thành tựu của văn minh Ai Cập thời cổ đại?",
                options: [
                    "A. Kim tự tháp Kê-ốp ở Ghi-da.",
                    "B. Tượng Nhân sư ở Ghi-da.",
                    "C. Tượng bán thân Nê-phéc-ti-ti.",
                    "D. Nắp quan tài bằng vàng của pha-ra-ông Tu-tan-kha-mun."
                ],
                correct: 0
            },
            {
                question: "Nội dung nào sau đây phản ánh đúng về khái niệm văn minh?",
                options: [
                    "A. Văn minh là sự phát triển rất cao về giáo dục và văn hóa.",
                    "B. Văn minh là sự đi đầu của cuộc cách mạng khoa học công nghệ.",
                    "C. Văn minh là sự tiến bộ về vật chất và tinh thần.",
                    "D. Văn minh là sự chuyển hóa thành công từ vượn thành người."
                ],
                correct: 2
            }
        ];

        // --- Trạng thái bài thi ---
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;

        // DOM Elements
        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const btnNext = document.getElementById('btn-next');
        const statProgress = document.getElementById('stat-progress');
        const statCorrect = document.getElementById('stat-correct');
        const statWrong = document.getElementById('stat-wrong');
        const statScore = document.getElementById('stat-score');
        const progressBar = document.getElementById('progress-bar');

        // Khởi tạo bài thi
        function initQuiz() {
            currentQuestions = [...quizData];
            currentIndex = 0;
            score = 0;
            wrongCount = 0;
            updateStats();
            loadQuestion();
        }

        // Tải câu hỏi hiện tại lên giao diện
        function loadQuestion() {
            if (currentIndex >= currentQuestions.length) {
                showResults();
                return;
            }

            isAnswered = false;
            btnNext.style.display = 'none';
            
            const q = currentQuestions[currentIndex];
            
            // Cập nhật thông tin câu hỏi
            questionNumberEl.textContent = `Câu ${currentIndex + 1} / ${currentQuestions.length}`;
            questionTextEl.textContent = q.question;
            
            // Xóa các đáp án cũ
            optionsContainer.innerHTML = '';
            
            // Render đáp án
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="option-letter">${letters[index]}</span>
                    <span class="option-text">${opt}</span>
                `;
                btn.onclick = () => selectAnswer(index, btn, q.correct);
                optionsContainer.appendChild(btn);
            });

            updateProgressBar();
        }

        // Xử lý khi người dùng chọn đáp án
        function selectAnswer(selectedIndex, selectedBtn, correctIndex) {
            if (isAnswered) return;
            isAnswered = true;

            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            
            // Khóa tất cả các nút
            allBtns.forEach(btn => btn.classList.add('disabled'));

            if (selectedIndex === correctIndex) {
                // Chọn đúng
                selectedBtn.classList.add('correct');
                score++;
            } else {
                // Chọn sai
                selectedBtn.classList.add('wrong');
                // Hiển thị đáp án đúng
                allBtns[correctIndex].classList.add('correct');
                wrongCount++;
            }

            updateStats();
            btnNext.style.display = 'block';
        }

        // Chuyển sang câu tiếp theo
        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        // Cập nhật thanh tiến độ và các chỉ số
        function updateStats() {
            statCorrect.textContent = score;
            statWrong.textContent = wrongCount;
            
            const totalDone = score + wrongCount;
            statProgress.textContent = `${totalDone}/${currentQuestions.length}`;
            
            let percentage = 0;
            if (totalDone > 0) {
                percentage = Math.round((score / totalDone) * 100);
            }
            statScore.textContent = `${percentage}%`;
        }

        function updateProgressBar() {
            const totalDone = score + wrongCount;
            const progressPercent = (totalDone / currentQuestions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }

        // Hiển thị kết quả cuối cùng
        function showResults() {
            questionNumberEl.textContent = "Hoàn thành!";
            questionTextEl.textContent = `Bạn đã hoàn thành bài luyện tập. Kết quả: ${score}/${currentQuestions.length} câu đúng.`;
            optionsContainer.innerHTML = '';
            btnNext.style.display = 'none';
            progressBar.style.width = '100%';
            
            // Có thể thêm nút làm lại ở đây nếu cần
        }

        // Làm lại từ đầu (giữ nguyên thứ tự)
        function resetQuiz() {
            if(confirm("Bạn có chắc muốn làm lại từ đầu?")) {
                initQuiz();
            }
        }

        // Xáo trộn câu hỏi và làm lại
        function shuffleQuiz() {
            if(confirm("Xáo trộn câu hỏi và bắt đầu lại?")) {
                // Thuật toán Fisher-Yates shuffle
                for (let i = currentQuestions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
                }
                currentIndex = 0;
                score = 0;
                wrongCount = 0;
                updateStats();
                loadQuestion();
            }
        }

        // Chạy ứng dụng khi tải trang
        window.onload = initQuiz;
    </script>
</body>
</html>
